name: Build and Test Pipeline

on:
   push:
   pull_request: 
     branches:
       - main

jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - name: checkout
         uses: actions/checkout@v7

       - name: build-output
         run: mkdir -p dist && echo "1.0.0" > dist/version.txt 

       - uses: actions/upload-artifact@v7
         with:
           name: app-build
           path: dist/version.txt
             
  test:
    runs-on:  ubuntu-latest
    needs: build
    steps:
       - name: checkout
         uses: actions/checkout@v7

       - uses: actions/download-artifact@v8
         with:
           name: app-build
         
       - name: Display structure of downloaded files
         run: cat dist/verison.txt
